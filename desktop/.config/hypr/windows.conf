# Floating windows
windowrule {
  name = windowrule-1
  float = on
  center = on
  size = 875 600
  match:tag = floating-window
}


windowrule {
  name = windowrule-2
  tag = +floating-window
  match:class = (tui-calcure|tui-bluetuith|tui-impala|TUI.float|imv|mpv)
}

windowrule {
  name = windowrule-3
  tag = +floating-window
  center = on
  match:title = Bitwarden Password Manager
}


windowrule {
  name = windowrule-4
  tag = +floating-window
  match:class = (xdg-desktop-portal-gtk|sublime_text|DesktopEditors|org.gnome.Nautilus)
  match:title = ^(Open.*Files?|Open [F|f]older.*|Save.*Files?|Save.*As|Save|All Files|.*wants to [open|save].*|[C|c]hoose.*)
}

windowrule {
  name = windowrule-5
  float = on
  match:class = org.gnome.Calculator
}


# No transparency on media windows
windowrule {
  name = windowrule-6
  opacity = 1 1
  match:class = ^(zoom|vlc|mpv|org.kde.kdenlive|com.obsproject.Studio|com.github.PintaProject.Pinta|imv|org.gnome.NautilusPreviewer)$
}


# Popped window rounding
windowrule {
  name = windowrule-7
  rounding = 8
  match:tag = pop
}

windowrule {
  name = windowrule-8
  float = on
  center = on
  size = 330 560
  match:title = Plexamp
}

windowrule {
  name = windowrule-9
  float = on
  center = on
  match:class = firefox
  match:title = Extension: \(Bitwarden Password Manager\)
}
