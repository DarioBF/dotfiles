# Extra env variables
# Note: You must relaunch Hyprland after changing envs (use Super+Esc, then Relaunch)
# env = MY_GLOBAL_ENV,setting

# Fix (Teorically) electron apps blurry fail
env = ELECTRON_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland

# ==============================
# Dark Mode GTK + Qt - Catppuccin Mocha Peach
# ==============================

# GTK3 / GTK4 apps
env = GTK_THEME,catppuccin-mocha-peach-standard+default
env = GTK_APPLICATION_PREFER_DARK_THEME,1

# Optional: force GTK4 apps color-scheme
exec = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'

# Qt5 / Qt6 apps
env = QT_QPA_PLATFORMTHEME,qt5ct      # qt5ct manager
env = QT_STYLE_OVERRIDE,kvantum       # Kvantum theme

# Kvantum: select the Catppuccin Mocha theme inside Kvantum Manager
# (Install Kvantum and catppuccin-kvantum-theme if not done yet)
env = GTK_THEME_VARIANT,dark

# Freetype & Fontconfig
env = FREETYPE_PROPERTIES,truetype:interpreter-version=35
env = FONTCONFIG_PATH,/etc/fonts

# Cursor size
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Force all apps to use Wayland
env = GDK_BACKEND,wayland,x11,*
env = QT_QPA_PLATFORM,wayland;xcb
env = QT_STYLE_OVERRIDE,kvantum
env = SDL_VIDEODRIVER,wayland,x11
env = MOZ_ENABLE_WAYLAND,1
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
env = OZONE_PLATFORM,wayland
env = XDG_SESSION_TYPE,wayland

# Allow better support for screen sharing (Google Meet, Discord, etc)
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland

xwayland {
  force_zero_scaling = true
}

# Use XCompose file
env = XCOMPOSEFILE,~/.XCompose

# Don't show update on first launch
ecosystem {
  no_update_news = true
}
